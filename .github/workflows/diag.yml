name: diag

# Diagnostica temporanea: prova a costruire una alsa-lib statica su Alpine,
# come farà il job musl. Viene cancellata appena la CI è verde.

on:
  push:
    paths:
      - ".github/workflows/diag.yml"

permissions:
  contents: write

jobs:
  alpine:
    name: alsa statica su alpine
    runs-on: ubuntu-22.04
    container: alpine:3.22
    steps:
      - name: Prepara
        run: |
          apk add --no-cache build-base musl-dev pkgconf git curl ca-certificates \
            tar gzip autoconf automake libtool linux-headers > install.log 2>&1 \
            || { tail -25 install.log | sed 's/^/::error::install /'; exit 1; }

      - name: Compila alsa-lib statica
        run: |
          set -e
          curl -sSfL -o alsa.tgz \
            https://codeload.github.com/alsa-project/alsa-lib/tar.gz/refs/tags/v1.2.14
          tar xzf alsa.tgz
          cd alsa-lib-1.2.14
          autoreconf -fi > ../conf.log 2>&1 \
            || { tail -30 ../conf.log | sed 's/^/::error::autoreconf /'; exit 1; }
          ./configure --prefix=/usr/local --disable-shared --enable-static \
            --disable-python > ../conf.log 2>&1 \
            || { tail -40 ../conf.log | sed 's/^/::error::configure /'; exit 1; }
          make -j"$(nproc)" > ../make.log 2>&1 \
            || { tail -40 ../make.log | sed 's/^/::error::make /'; exit 1; }
          make install >> ../make.log 2>&1 \
            || { tail -40 ../make.log | sed 's/^/::error::install-alsa /'; exit 1; }

      - name: Verifica
        run: |
          { echo "PC: $(pkg-config --libs --static alsa 2>&1)"
            printf '%s\n' '#include <alsa/asoundlib.h>' \
              'int main(void) { snd_config_update(); return snd_config_top(0); }' > /tmp/t.c
            if cc -static -o /tmp/t /tmp/t.c $(pkg-config --cflags --libs --static alsa) 2> /tmp/link.log; then
              echo "LINK OK: $(file -b /tmp/t)"
            else
              echo "LINK KO: $(tail -3 /tmp/link.log | tr '\n' ' ')"
            fi
            echo "STUB: $(ls /usr/lib/libpthread.a /usr/lib/libm.a /usr/lib/librt.a 2>&1 | tr '\n' ' ')"
          } 2>&1 | sed 's/^/::error::diag /'
