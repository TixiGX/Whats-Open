name: diag

# Diagnostica temporanea: verifica le immagini dei container usate dalla CI.
# Viene cancellata appena i job glibc e musl funzionano.

on:
  push:
    paths:
      - ".github/workflows/diag.yml"

permissions:
  contents: write

jobs:
  ubuntu:
    name: strumenti ubuntu 20.04
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - name: Installa
        shell: bash
        run: |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update 2>&1 | tail -5
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git \
            libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev 2>&1 | tail -15
          ldd --version | head -1
          pkg-config --modversion alsa

  alpine:
    name: strumenti alpine
    runs-on: ubuntu-22.04
    container: alpine:3.22
    steps:
      - name: Installa
        run: |
          set -x
          apk add --no-cache build-base musl-dev pkgconf git curl ca-certificates tar gzip alsa-lib-dev linux-headers
          echo "=== libasound"
          ls -l /usr/lib/libasound* || true
          echo "=== contenuto alsa-lib-dev"
          apk info -L alsa-lib-dev | grep -i asound || true
          echo "=== pacchetti alsa"
          apk search alsa | head -20
          echo "=== pkgconfig"
          pkg-config --libs alsa
          pkg-config --static --libs alsa
