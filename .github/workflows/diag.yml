name: diag

# Diagnostica temporanea: verifica le immagini dei container usate dalla CI.
# Viene cancellata appena i job glibc e musl funzionano.

on:
  push:
    paths:
      - ".github/workflows/diag.yml"

permissions:
  contents: write

jobs:
  ubuntu:
    name: strumenti ubuntu 20.04
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - name: Installa
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > update.log 2>&1 || { tail -20 update.log | sed 's/^/::error::update /'; exit 1; }
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git \
            libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev > install.log 2>&1 \
            || { tail -25 install.log | sed 's/^/::error::install /'; exit 1; }
          ldd --version | head -1 | sed 's/^/::error::glibc /'
          pkg-config --modversion alsa | sed 's/^/::error::alsa /'

  alpine:
    name: strumenti alpine
    runs-on: ubuntu-22.04
    container: alpine:3.22
    steps:
      - name: Installa
        run: |
          apk add --no-cache build-base musl-dev pkgconf git curl ca-certificates tar gzip alsa-lib-dev linux-headers > install.log 2>&1 \
            || { tail -25 install.log | sed 's/^/::error::install /'; exit 1; }
          { echo "=== libasound"; ls -l /usr/lib/libasound* 2>&1
            echo "=== contenuto alsa-lib-dev"; apk info -L alsa-lib-dev
            echo "=== pacchetti alsa"; apk search alsa
            echo "=== pkg-config"; pkg-config --libs alsa; pkg-config --static --libs alsa
          } 2>&1 | sed 's/^/::error::diag /'
